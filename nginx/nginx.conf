#
# Privasimu Nexus — NGINX main config
#

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65536;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time uct=$upstream_connect_time '
                      'urt=$upstream_response_time tenant=$http_x_privasimu_tenant';

    access_log  /var/log/nginx/access.log  main;

    # Performance tuning untuk AI workload (streaming long response)
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   300s;
    keepalive_requests  1000;

    # Body size — AI request bisa besar (contract review, OCR image upload)
    client_max_body_size      50m;
    client_body_buffer_size   1m;
    client_body_timeout       600s;

    # Proxy timeout — LLM streaming bisa lama (contract review ~3 menit)
    proxy_connect_timeout     60s;
    proxy_send_timeout        600s;
    proxy_read_timeout        600s;

    # Buffering: OFF untuk streaming SSE (vLLM chat streaming)
    proxy_buffering           off;
    proxy_request_buffering   off;

    # Gzip untuk response non-streaming (metrics, health)
    gzip              on;
    gzip_types        text/plain application/json;
    gzip_min_length   1024;

    # ─── Rate limiting ────────────────────────────────────────────────────
    # Semua request dari backend Privasimu datang dari SATU IP, jadi kunci
    # per-IP membuat seluruh tenant berbagi satu ember. Backend (AiService)
    # mengirim header `X-Privasimu-Tenant`: hash pendek org_id (16 heksa,
    # tidak bisa dibalik ke UUID) atau `platform` untuk panggilan tanpa org.
    #
    # $ai_rate_key:
    #   - header ada & formatnya wajar → "t:<nilai header>" (ember per tenant)
    #   - header kosong / format aneh   → "ip:<IP klien>"   (perilaku lama)
    # Validasi format mencegah header raksasa/aneh memenuhi shared memory.
    map $http_x_privasimu_tenant $ai_rate_key {
        "~^(?<ai_tenant>[A-Za-z0-9_-]{1,64})$"  "t:$ai_tenant";
        default                                  "ip:$remote_addr";
    }

    # Kuota per tenant (kunci $ai_rate_key). Tuning: lihat
    # docs/PRIVASIMU_INTEGRATION.md → "Rate limit per tenant".
    limit_req_zone  $ai_rate_key         zone=ai_chat:10m      rate=30r/m;
    limit_req_zone  $ai_rate_key         zone=ai_embed:10m     rate=300r/m;
    limit_req_zone  $ai_rate_key         zone=ai_ocr:10m       rate=60r/m;

    # Plafon gabungan per IP klien. Header tenant dikirim klien, jadi klien
    # yang nakal bisa mengganti nilainya tiap request untuk mendapat ember
    # baru; plafon ini membatasi total yang bisa dikirim satu IP (= seluruh
    # backend Privasimu) supaya GPU tetap terlindungi. Set ≥ jumlah tenant
    # aktif bersamaan × rate per tenant.
    limit_req_zone  $binary_remote_addr  zone=ai_chat_ip:10m   rate=300r/m;
    limit_req_zone  $binary_remote_addr  zone=ai_embed_ip:10m  rate=3000r/m;
    limit_req_zone  $binary_remote_addr  zone=ai_ocr_ip:10m    rate=600r/m;

    # Kena limit → 429 (bukan 503 bawaan NGINX) supaya backend tahu ini
    # pembatasan, bukan server mati.
    limit_req_status  429;
    limit_req_log_level  warn;

    # Upstream definitions
    upstream vllm_backend {
        server privasimu-vllm:8000;
        keepalive 32;
    }

    # VLM fallback — hanya aktif di profile qwen3-32b.
    # Kalau service tidak running, NGINX otomatis fallback ke vllm_backend
    # via map berikut (see ai-services.conf)
    upstream vlm_backend {
        server privasimu-vlm:8001 max_fails=3 fail_timeout=30s;
        server privasimu-vllm:8000 backup;
        keepalive 16;
    }

    upstream tei_backend {
        server privasimu-embeddings:80;
        keepalive 32;
    }

    upstream ocr_backend {
        server privasimu-ocr:8868;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
