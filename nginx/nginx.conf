#
# Privasimu Nexus — NGINX main config
#

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65536;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time uct=$upstream_connect_time '
                      'urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    # Performance tuning untuk AI workload (streaming long response)
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   300s;
    keepalive_requests  1000;

    # Body size — AI request bisa besar (contract review, OCR image upload)
    client_max_body_size      50m;
    client_body_buffer_size   1m;
    client_body_timeout       600s;

    # Proxy timeout — LLM streaming bisa lama (contract review ~3 menit)
    proxy_connect_timeout     60s;
    proxy_send_timeout        600s;
    proxy_read_timeout        600s;

    # Buffering: OFF untuk streaming SSE (vLLM chat streaming)
    proxy_buffering           off;
    proxy_request_buffering   off;

    # Gzip untuk response non-streaming (metrics, health)
    gzip              on;
    gzip_types        text/plain application/json;
    gzip_min_length   1024;

    # Rate limiting zones
    limit_req_zone  $binary_remote_addr  zone=ai_chat:10m   rate=30r/m;
    limit_req_zone  $binary_remote_addr  zone=ai_embed:10m  rate=300r/m;
    limit_req_zone  $binary_remote_addr  zone=ai_ocr:10m    rate=60r/m;

    # Upstream definitions
    upstream vllm_backend {
        server privasimu-vllm:8000;
        keepalive 32;
    }

    # VLM fallback — hanya aktif di profile qwen3-32b.
    # Kalau service tidak running, NGINX otomatis fallback ke vllm_backend
    # via map berikut (see ai-services.conf)
    upstream vlm_backend {
        server privasimu-vlm:8001 max_fails=3 fail_timeout=30s;
        server privasimu-vllm:8000 backup;
        keepalive 16;
    }

    upstream tei_backend {
        server privasimu-embeddings:80;
        keepalive 32;
    }

    upstream ocr_backend {
        server privasimu-ocr:8868;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
