#
# Privasimu Nexus — AI Services Routing
#
# Routes:
#   /v1/*          → vLLM OpenAI-compatible endpoint (chat, completions)
#   /embed/*       → TEI embeddings
#   /ocr/*         → PaddleOCR
#   /metrics       → Prometheus scrape endpoint (internal only)
#   /healthz       → Health check
#

# HTTP → HTTPS redirect (production: WAJIB pakai TLS)
server {
    listen 80 default_server;
    server_name _;

    # Expose health check di HTTP untuk monitoring external
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Redirect lainnya ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS main server
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # TLS config — cert mount dari .env TLS_DIR
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Access log with rotation-friendly format
    access_log /var/log/nginx/ai-access.log main;

    # Optional: token-based auth (uncomment + set API_ACCESS_TOKEN di .env)
    # set $valid_token 0;
    # if ($http_authorization = "Bearer ${API_ACCESS_TOKEN}") { set $valid_token 1; }
    # if ($valid_token = 0) { return 401; }

    # Health check — cepat, tidak rate-limited
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # =========================================================================
    # vLLM — Primary LLM (chat + vision kalau model support native VLM)
    # =========================================================================
    # Matches: /v1/chat/completions, /v1/completions, /v1/models
    # Backend:
    #   - Qwen3-32B profile: chat only (text)
    #   - Qwen3.6-27B profile: chat + native vision (multimodal via image_url)
    location /v1/ {
        limit_req zone=ai_chat burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://vllm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming-friendly
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # =========================================================================
    # VLM endpoint — untuk vision-heavy request
    # =========================================================================
    # Qwen3-32B profile:     route ke privasimu-vlm:8001 (Qwen2.5-VL-7B)
    # Qwen3.6-27B profile:   auto-fallback ke vllm_backend (no separate VLM)
    #
    # Backend Privasimu bisa call /vlm/v1/chat/completions untuk pasti kena
    # VLM service — stack akan route ke model yang sesuai profile.
    location /vlm/v1/ {
        limit_req zone=ai_chat burst=10 nodelay;

        rewrite ^/vlm(/v1/.*)$ $1 break;
        proxy_pass http://vlm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Vision request bisa besar (image payload)
        client_max_body_size 30m;

        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # =========================================================================
    # TEI — Embeddings endpoint
    # =========================================================================
    # Exposed di /embed/* — backend panggil POST /embed/embed
    location /embed/ {
        limit_req zone=ai_embed burst=50 nodelay;

        # Strip /embed prefix sebelum forward
        rewrite ^/embed/(.*)$ /$1 break;
        proxy_pass http://tei_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # =========================================================================
    # PaddleOCR endpoint
    # =========================================================================
    location /ocr/ {
        limit_req zone=ai_ocr burst=10 nodelay;

        rewrite ^/ocr/(.*)$ /$1 break;
        proxy_pass http://ocr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # OCR image upload — increase body size tolerance
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }

    # Default — 404
    location / {
        return 404 "Privasimu AI Gateway — endpoint tidak ditemukan\n";
        add_header Content-Type text/plain;
    }
}
